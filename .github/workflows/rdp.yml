name: Windows-RDP-Ngrok
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup RDP Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          net user runneradmin P@ssw0rd12345
      - name: Download and Run Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip
          .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process -FilePath .\ngrok.exe -ArgumentList "tcp 3389" -NoNewWindow
      - name: Connection details
        run: |
          Start-Sleep -Seconds 10
          $response = Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing
          $json = $response.Content | ConvertFrom-Json
          $url = $json.tunnels[0].public_url
          Write-Host "=========================================="
          Write-Host "Remote Desktop Address: $url"
          Write-Host "Username: runneradmin"
          Write-Host "Password: P@ssw0rd12345"
          Write-Host "=========================================="
      - name: Keep Alive (Max 6 Hours)
        run: Start-Sleep -Seconds 21600
